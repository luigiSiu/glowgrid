# glowgrid is not a Python package and is not published to PyPI. This file is
# here for two smaller reasons: it is where the repository's version number
# lives (see "Version numbers, and where they live" in the README), and it gives
# uv a project root so a virtualenv lands in a predictable place.
#
# The command line tools in mac-cli/ declare their own dependencies inline with
# PEP 723, so they run with no install step and no venv to activate. That is why
# `dependencies` below is empty and should stay that way.

[project]
name = "glowgrid"
version = "0.1.0"
description = "An 8x8 LED panel that shows whether you can be interrupted"
readme = "README.md"
# 3.10 for the `X | None` syntax the CLI uses. This matches the PEP 723 block
# in mac-cli/glowgrid.py; uv init had written a far narrower floor here, which
# would have implied the tools need a Python they do not.
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.urls]
Homepage = "https://github.com/luigiSiu/glowgrid"
Changelog = "https://github.com/luigiSiu/glowgrid/blob/main/CHANGELOG.md"
